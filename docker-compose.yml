services:
  postgres:
    image: postgres:16-alpine
    container_name: agricore-postgres
    environment:
      POSTGRES_USER: agricore
      POSTGRES_PASSWORD: agricore
      POSTGRES_DB: agricore
    ports:
      # Host 5432 is commonly taken by a local Postgres install.
      - "5433:5432"
    volumes:
      - agricore_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agricore -d agricore"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  agricore_pgdata:
